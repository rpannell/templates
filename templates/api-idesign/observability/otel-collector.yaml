# OpenTelemetry Collector: the only place that knows where telemetry goes.
# The API always sends OTLP here. Swap or add exporters to change backends, with no code changes.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Prometheus 3 native OTLP ingestion (the otlp_http exporter adds /v1/metrics to this path).
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

  # Aspire dashboard for local logs and traces.
  otlp_grpc/dashboard:
    endpoint: dashboard:18889
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/prometheus, otlp_grpc/dashboard]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/dashboard]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/dashboard]
