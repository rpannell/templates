# Blob Storage -> Event Grid system topic (Microsoft.Storage.BlobCreated) -> Service Bus queue -> this binding.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: object-created
spec:
  type: bindings.azure.servicebusqueues
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: servicebus
        key: connectionString
    - name: queueName
      value: "object-created"
    - name: direction
      value: "input"
    - name: route
      value: "/functions/object-created"
