# Google Cloud Storage. Keep FileProcessing__ObjectStorage__KeyMetadataName=key (the default).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: object-storage
spec:
  type: bindings.gcp.bucket
  version: v1
  metadata:
    - name: bucket
      value: "imports"
    - name: direction
      value: "output"
