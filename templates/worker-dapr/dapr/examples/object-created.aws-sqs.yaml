# S3 bucket -> Event notifications (s3:ObjectCreated:*) -> SQS queue -> this binding.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: object-created
spec:
  type: bindings.aws.sqs
  version: v1
  metadata:
    - name: queueName
      value: "object-created"
    - name: region
      value: "us-east-1"
    - name: direction
      value: "input"
    - name: route
      value: "/functions/object-created"
